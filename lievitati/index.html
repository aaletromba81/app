<style>
:root { --bg: #f6efe2; --panel: #fffaf2; --ink: #2e2117; --dim: #7a6653; --line: #e5d6bf; --crust: #9c5a17; --warn: #ad3f2d; color-scheme: light; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: grid; place-items: center; padding: calc(24px + env(safe-area-inset-top, 0px)) 16px calc(24px + env(safe-area-inset-bottom, 0px)); }
.box { width: 100%; max-width: 380px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 22px 18px; text-align: center; }
.box img { width: 100%; max-width: 300px; height: auto; display: block; margin: 0 auto 14px; }
h1 { font: 600 1.1rem/1.3 Georgia, serif; margin: 0 0 4px; }
p { color: var(--dim); font-size: .9rem; margin: 0 0 14px; }
input[type=password] { width: 100%; padding: 12px; font-size: 1rem; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); }
input:focus-visible, button:focus-visible { outline: 2px solid var(--crust); outline-offset: 2px; }
label.rem { display: flex; gap: 8px; align-items: center; justify-content: center; font-size: .85rem; color: var(--dim); margin: 10px 0 14px; }
button { width: 100%; padding: 12px; font-size: 1rem; font-weight: 700; border: 0; border-radius: 10px; background: var(--crust); color: #fff; cursor: pointer; }
button[disabled] { opacity: .6; }
.err { color: var(--warn); font-size: .88rem; min-height: 1.3em; margin: 10px 0 0; }
</style>
</head>
<body>

  <label class="rem"><input type="checkbox" id="rem" checked> Ricorda su questo dispositivo</label>
  <button id="go" type="submit">Apri</button>
  <p class="err" id="err" role="alert"></p>
</form>

var KEY_NAME = 'lucchetto_lievitati';
function b64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
function tob64(u) { var s = ''; u = new Uint8Array(u); for (var i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); }
function avvia(html) { document.open(); document.write(html); document.close(); }
async function decifra(key) {
  var buf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(LOCK.iv) }, key, b64(LOCK.ct));
  return new TextDecoder().decode(buf);
}
async function chiave(pw) {
  var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(LOCK.salt), iterations: LOCK.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
}
(async function () {
  // chiave ricordata: apre subito
  try {
    var saved = JSON.parse(localStorage.getItem(KEY_NAME) || 'null');
    if (saved && saved.salt === LOCK.salt) {
      var k = await crypto.subtle.importKey('raw', b64(saved.k), { name: 'AES-GCM' }, false, ['decrypt']);
      avvia(await decifra(k)); return;
    }
  } catch (e) { /* chiede la password */ }
  document.getElementById('pw').focus();
})();
document.getElementById('f').addEventListener('submit', async function (e) {
  e.preventDefault();
  var go = document.getElementById('go'), err = document.getElementById('err');
  err.textContent = ''; go.disabled = true; go.textContent = 'Apro…';
  try {
    var k = await chiave(document.getElementById('pw').value);
    var html = await decifra(k);
    if (document.getElementById('rem').checked) {
      try { localStorage.setItem(KEY_NAME, JSON.stringify({ salt: LOCK.salt, k: tob64(await crypto.subtle.exportKey('raw', k)) })); } catch (e2) { /* non ricordata */ }

    avvia(html);
  } catch (ex) {
    err.textContent = 'Password sbagliata. Riprova.';
    go.disabled = false; go.textContent = 'Apri';
  }
});
